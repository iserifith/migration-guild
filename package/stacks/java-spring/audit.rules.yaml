- id: jvm-internal-api
  finding: jvm
  category: internal-api
  severity: critical
  match: '\b(?:sun|com\.sun|jdk\.internal)\.[A-Za-z0-9_$.]+'
  flags: g
  summary_template: 'Internal JDK API usage detected: {symbol}'
  remediation: Replace internal JDK APIs with supported Java SE or framework equivalents before planning.
- id: jvm-removed-api
  finding: jvm
  category: removed-api
  severity: critical
  match: '\bjavax\.(?:xml\.bind|activation|annotation\.PostConstruct|annotation\.PreDestroy)\b'
  flags: g
  summary_template: 'Removed or decoupled Java SE API detected: {symbol}'
  remediation: Adopt supported Jakarta or external library replacements and record the target modernization strategy before planning.
- id: jvm-deprecated-api
  finding: jvm
  category: deprecated-api
  severity: warning
  match: '\b(?:System\.setSecurityManager|SecurityManager\b|Thread\.(?:stop|suspend|resume)\b|java\.applet\.)'
  flags: g
  summary_template: 'Deprecated JVM API usage detected: {symbol}'
  remediation: Plan a supported replacement and capture the migration notes before code generation.
- id: dependency-log4j
  finding: dependency
  dependency_name: log4j:log4j
  target_hint: org.slf4j:slf4j-api
  category: eol
  severity: critical
  match: '\borg\.apache\.log4j\b'
  flags: g
  summary_template: 'EOL Log4j 1.x API detected{version}'
  remediation: Approve a replacement strategy to SLF4J/Log4j 2-compatible APIs before planning can continue.
  details_template: 'Log4j 1.x is end-of-life and should not advance into migrated outputs without an explicit replacement plan. Evidence: L{line}: {text}'
  coordinate_hints: [log4j:log4j]
- id: dependency-junit4
  finding: dependency
  dependency_name: junit:junit
  target_hint: org.junit.jupiter:junit-jupiter
  category: outdated
  severity: warning
  match: '\b(?:junit\.framework|org\.junit\.(?!jupiter))'
  flags: g
  summary_template: 'JUnit 4-era test API detected{version}'
  remediation: Approve an upgrade strategy to JUnit 5 before the affected artifact can progress.
  details_template: 'Migration targets use JUnit 5 for generated tests and retained compatibility should be explicit. Evidence: L{line}: {text}'
  coordinate_hints: [junit:junit]
- id: dependency-commons-logging
  finding: dependency
  dependency_name: commons-logging:commons-logging
  target_hint: org.slf4j:slf4j-api
  category: outdated
  severity: warning
  match: '\borg\.apache\.commons\.logging\b'
  flags: g
  summary_template: 'Commons Logging API detected{version}'
  remediation: Approve a logging facade upgrade or replacement strategy before planning can continue.
  details_template: 'Generated Spring Boot targets should use SLF4J-compatible logging rather than legacy Commons Logging calls. Evidence: L{line}: {text}'
  coordinate_hints: [commons-logging:commons-logging]
- id: dependency-servlet
  finding: dependency
  dependency_name: javax.servlet:javax.servlet-api
  target_hint: jakarta.servlet:jakarta.servlet-api
  category: incompatible
  severity: warning
  match: '\bjavax\.servlet\b'
  flags: g
  summary_template: 'Legacy javax.servlet API detected{version}'
  remediation: Approve the jakarta.servlet replacement plan before the affected artifact can progress.
  details_template: 'Spring Boot 3 targets require Jakarta namespace APIs. Evidence: L{line}: {text}'
  coordinate_hints: [javax.servlet:javax.servlet-api, javax.servlet:servlet-api]
- id: dependency-jaxrs
  finding: dependency
  dependency_name: javax.ws.rs:javax.ws.rs-api
  target_hint: jakarta.ws.rs:jakarta.ws.rs-api
  category: incompatible
  severity: warning
  match: '\bjavax\.ws\.rs\b'
  flags: g
  summary_template: 'Legacy javax.ws.rs API detected{version}'
  remediation: Approve the Jakarta or Spring Web replacement strategy before planning can continue.
  details_template: 'Modern Spring Boot targets should not carry forward javax.ws.rs APIs without an explicit modernization plan. Evidence: L{line}: {text}'
  coordinate_hints: [javax.ws.rs:javax.ws.rs-api]
- id: view-regeneration-jsp
  finding: jvm
  category: view-regeneration
  severity: critical
  match: '<%@|<jsp:|<%[!=]'
  flags: g
  summary_template: 'JSP view artifact detected: {symbol}'
  remediation: Replace with the pack-declared API contract output (see stack.yaml view_contract). Extract routing, validation, and business logic; drop layout, markup, and styling.
  details_template: 'Legacy view-layer UI must not be regenerated in modern/. Evidence: L{line}: {text}'
- id: view-regeneration-jsf
  finding: jvm
  category: view-regeneration
  severity: critical
  match: '\b(?:javax\.faces|jakarta\.faces)\b|<[hf]:[A-Za-z]'
  flags: g
  summary_template: 'JSF/Facelets view artifact detected: {symbol}'
  remediation: Replace with the pack-declared API contract output. Extract behavior; drop the component tree and presentation.
  details_template: 'Legacy view-layer UI must not be regenerated in modern/. Evidence: L{line}: {text}'
- id: view-regeneration-legacy-view-imports
  finding: jvm
  category: view-regeneration
  severity: critical
  match: '\b(?:javax\.servlet\.jsp|JspException|PageContext|TagSupport|org\.apache\.struts\.taglib)\b'
  flags: g
  summary_template: 'Legacy view-framework usage in migrated code: {symbol}'
  remediation: Remove the view-framework dependency; the module must expose an API contract backed by behavior-preserving handlers.
  details_template: 'View-framework imports indicate regenerated view-layer UI. Evidence: L{line}: {text}'
- id: view-regeneration-template-engine
  finding: jvm
  category: view-regeneration
  severity: warning
  match: '\b(?:TemplateEngine|thymeleaf|freemarker|velocity)\b.*(?:process|render)'
  flags: g
  summary_template: 'Server-side template rendering of a possibly legacy-derived view: {symbol}'
  remediation: Confirm this is a target-native, reviewable exception and not regenerated legacy UI; otherwise replace with the API contract output.
  details_template: 'Target-side server rendering is an explicit exception, not a default. Evidence: L{line}: {text}'
# view-logic-placement-* (issue #100, amends #59): complements the
# view-regeneration-* presence/absence rules above with a placement check —
# is extracted validation/business logic in a dedicated *Validator/*Service,
# or still inline in the handler? Line-scoped regex matching (no
# class-name/file-role awareness in the audit engine, no cross-line
# correlation), so these are a coarse heuristic like the template-engine
# rule above, not a precise "handler class" detector: the negative lookahead
# only rules out a Service/Validator reference on the SAME line as the
# signal, and a properly consolidated handler simply has no inline
# signal lines left to match (the logic lives in the separate module).
# Warning severity is deliberate (plan.md Constraints; spec Edge Cases) —
# the reviewer resolves borderline/false-positive cases, same convention as
# view-regeneration-template-engine's "confirm this is a reviewable
# exception" framing.
- id: view-logic-placement-inline-validation
  finding: jvm
  category: view-logic-placement
  severity: warning
  match: '(?:if\s*\(.*(?:==\s*null|\.isEmpty\(\)).*\)|\.hasErrors\(\)|\.matches\("[^"]*"\))(?!.*\b(?:Validator|Service)\b)'
  flags: g
  summary_template: 'Inline validation logic detected outside a dedicated Validator: {symbol}'
  remediation: Extract this validation into the pack-declared *Validator module (see stack.yaml logic_extraction.validator_suffix); the handler should only invoke it and delegate. Deduplicate if the same rule is copied across endpoints.
  details_template: 'Extracted validation logic must consolidate into a dedicated, named *Validator module, not live inline in the handler. Evidence: L{line}: {text}'
- id: view-logic-placement-inline-business-rule
  finding: jvm
  category: view-logic-placement
  severity: warning
  match: '\}\s*else\s+if\s*\(.*\)\s*\{(?!.*\b(?:Validator|Service)\b)'
  flags: g
  summary_template: 'Inline multi-branch business-rule logic detected outside a dedicated Service: {symbol}'
  remediation: Extract this business-rule logic into the pack-declared *Service module (see stack.yaml logic_extraction.service_suffix); the handler should only invoke it and delegate. Deduplicate if the same rule is copied across endpoints.
  details_template: 'Extracted business logic must consolidate into a dedicated, named *Service module, not live inline in the handler. Evidence: L{line}: {text}'
